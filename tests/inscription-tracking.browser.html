<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1" /></head><body style="margin:0"><div id="root"></div><pre id="test-result" style="white-space:pre-wrap;overflow-wrap:anywhere">RUNNING</pre><script type="module">
const width = new URLSearchParams(location.search).get('width');
if (!width) await import('/tests/inscription-tracking.browser.tsx');
else {
  const frame = document.createElement('iframe'); frame.style.cssText = `width:${Number(width)}px;height:1250px;border:0`; frame.src = '/tests/inscription-tracking.browser.html' + (new URLSearchParams(location.search).has('capture') ? '?capture=admin' : '');document.getElementById('root').append(frame);
  const timer=setInterval(()=>{const text=frame.contentDocument?.getElementById('test-result')?.textContent;if(text?.startsWith('{')){document.getElementById('test-result').textContent=text;clearInterval(timer);}},100);
}
</script></body></html>
